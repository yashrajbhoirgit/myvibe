<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1DB954"/>
      <stop offset="100%" stop-color="#1ed760"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Sound waves -->
  <g transform="translate(256,256)">
    <rect x="-80" y="-60" width="20" height="120" rx="10" fill="white" opacity="0.9"/>
    <rect x="-40" y="-90" width="20" height="180" rx="10" fill="white" opacity="0.95"/>
    <rect x="0" y="-40" width="20" height="80" rx="10" fill="white"/>
    <rect x="40" y="-100" width="20" height="200" rx="10" fill="white" opacity="0.95"/>
    <rect x="80" y="-50" width="20" height="100" rx="10" fill="white" opacity="0.9"/>
  </g>
</svg>
